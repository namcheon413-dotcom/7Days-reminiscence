<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>七曜回顧錄</title>

  <link rel="stylesheet" href="./css/style.css">
</head>


<body>


  <!-- ========================================
       TITLE SCREEN
  ========================================= -->

  <main id="title-screen">


    <!-- BACKGROUND VIDEO -->

    <video
      id="title-video"
      autoplay
      muted
      loop
      playsinline
    >
      <source
        src="./assets/video/title.mp4"
        type="video/mp4"
      >
    </video>


    <!-- 영상 위 명암 -->

    <div class="video-overlay"></div>



    <!-- ========================================
         INITIALIZE SCREEN
    ========================================= -->

    <section
      id="initialize-screen"
      class="screen-layer active"
    >

      <h1 class="initialize-title">
        七曜回顧錄
      </h1>

      <p class="initialize-text">
        CLICK TO INITIALIZE
      </p>

    </section>



    <!-- ========================================
         MAIN TITLE UI
    ========================================= -->

    <section
      id="main-title"
      class="screen-layer"
    >

      <!-- 화면 상단 -->

      <p class="fanmade">
        fanmade by anonymous agent
      </p>


      <!-- 화면 중앙 -->

      <div class="title-content">

        <img
          class="game-logo"
          src="./assets/images/logo.png"
          alt="七曜回顧錄"
        >

        <button
          id="start-button"
          type="button"
        >
          START
        </button>

      </div>


      <!-- 화면 하단 -->

      <div class="bottom-text">
        7 DAYS : REMINISCENCE
      </div>

    </section>


  </main>



  <!-- ========================================
       LOBBY SCREEN
  ========================================= -->

  <main
    id="lobby-screen"
    class="game-screen"
  >


    <!-- ========================================
         LOBBY HEADER
    ========================================= -->

    <header class="lobby-header">


      <!-- 왼쪽 게임 타이틀 -->

      <div class="lobby-brand">

        <span class="lobby-brand-main">
          七曜回顧錄
        </span>

        <span class="lobby-brand-sub">
          7 DAYS : REMINISCENCE
        </span>

      </div>


      <!-- 오른쪽 설정 -->

      <button
        id="settings-button"
        class="header-button"
        type="button"
        aria-label="설정"
      >
        SETTINGS
      </button>


    </header>



    <!-- ========================================
         LOBBY MAIN VISUAL
    ========================================= -->

    <section class="lobby-main">


      <div class="lobby-visual">


        <!--
          임시 로비 중앙 영역.
          나중에 캐릭터 일러스트 / 배경으로 교체.
        -->

        <div class="lobby-visual-placeholder">


          <!-- 중앙 작은 영문 -->

          <span class="lobby-unit-label">
            FIELD DIVISION · UNIT 01
          </span>


          <!-- 중앙 메인 -->

          <h2 class="lobby-unit-title">
            현장부 1조
          </h2>


          <div class="lobby-unit-line"></div>


          <!-- 중앙 부대명 -->

          <p class="lobby-unit-name">
            「반영」
          </p>


        </div>


      </div>


    </section>



    <!-- ========================================
         LOBBY NAVIGATION
    ========================================= -->

    <nav class="lobby-nav">


      <!-- 사건 -->

      <button
        class="lobby-nav-button"
        data-screen="case"
        type="button"
      >

        <span class="nav-en">
          CASE
        </span>

        <span class="nav-ko">
          사건
        </span>

      </button>



      <!-- 편성 -->

      <button
        class="lobby-nav-button"
        data-screen="roster"
        type="button"
      >

        <span class="nav-en">
          ROSTER
        </span>

        <span class="nav-ko">
          편성
        </span>

      </button>



      <!-- 인물 -->

      <button
        class="lobby-nav-button"
        data-screen="agent"
        type="button"
      >

        <span class="nav-en">
          AGENT
        </span>

        <span class="nav-ko">
          인물
        </span>

      </button>



      <!-- 기록 -->

      <button
        class="lobby-nav-button"
        data-screen="archive"
        type="button"
      >

        <span class="nav-en">
          ARCHIVE
        </span>

        <span class="nav-ko">
          기록
        </span>

      </button>


    </nav>


  </main>



  <!-- ========================================
       JAVASCRIPT
  ========================================= -->

  <script src="./js/audio.js?v=2"></script>
  <script src="./js/main.js?v=2"></script>


</body>

</html>
