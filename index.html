<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>七曜回顧錄</title>

  <link rel="stylesheet" href="./css/style.css">
</head>

<body>

  <main id="title-screen">

    <!-- ================================
         BACKGROUND VIDEO
    ================================= -->

    <video
      id="title-video"
      autoplay
      muted
      loop
      playsinline
    >
      <source
        src="./assets/video/title.mp4"
        type="video/mp4"
      >
    </video>


    <!-- 영상 위 명암 -->
    <div class="video-overlay"></div>


    <!-- ================================
         INITIALIZE SCREEN
    ================================= -->

    <section
      id="initialize-screen"
      class="screen-layer active"
    >

      <h1 class="initialize-title">
        七曜回顧錄
      </h1>

      <p class="initialize-text">
        CLICK TO INITIALIZE
      </p>

    </section>


    <!-- ================================
         MAIN TITLE UI
    ================================= -->

    <section
      id="main-title"
      class="screen-layer"
    >

      <div class="title-content">

        <p class="fanmade">
          fanmade by anonymous agent
        </p>

<img
  class="game-logo"
  src="./assets/images/logo.png"
  alt="七曜回顧錄"
>
        <div class="title-line"></div>

        <button
          id="start-button"
          type="button"
        >
          START
        </button>

      </div>

      <div class="bottom-text">
        7 DAYS : REMINISCENCE
      </div>

    </section>

  </main>


  <!-- ================================
       AUDIO
  ================================= -->

  <script src="./js/audio.js"></script>
  <script src="./js/main.js"></script>

</body>

</html>
