<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>七曜回顧錄</title>

  <link rel="stylesheet" href="./css/style.css?v=3">
</head>


<body>


  <!-- ========================================
       TITLE SCREEN
  ========================================= -->

  <main id="title-screen">

    <video
      id="title-video"
      autoplay
      muted
      loop
      playsinline
    >
      <source
        src="./assets/video/title.mp4"
        type="video/mp4"
      >
    </video>


    <div class="video-overlay"></div>


    <!-- INITIALIZE -->

    <section
      id="initialize-screen"
      class="screen-layer active"
    >

      <h1 class="initialize-title">
        七曜回顧錄
      </h1>

      <p class="initialize-text">
        CLICK TO INITIALIZE
      </p>

    </section>


    <!-- MAIN TITLE -->

    <section
      id="main-title"
      class="screen-layer"
    >

      <p class="fanmade">
        fanmade by anonymous agent
      </p>


      <div class="title-content">

        <img
          class="game-logo"
          src="./assets/images/logo.png"
          alt="七曜回顧錄"
        >

        <button
          id="start-button"
          type="button"
        >
          START
        </button>

      </div>


      <div class="bottom-text">
        7 DAYS : REMINISCENCE
      </div>

    </section>

  </main>


  <!-- ========================================
       LOBBY SCREEN
  ========================================= -->

  <main
    id="lobby-screen"
    class="game-screen"
  >


    <!-- LOBBY HEADER -->

    <header class="lobby-header">

      <div class="lobby-brand">

        <span class="lobby-brand-main">
          七曜回顧錄
        </span>

        <span class="lobby-brand-sub">
          7 DAYS : REMINISCENCE
        </span>

      </div>


      <button
        id="settings-button"
        class="header-button"
        type="button"
        aria-label="설정"
      >
        SETTINGS
      </button>

    </header>


    <!-- LOBBY MAIN -->

    <section class="lobby-main">


      <!-- GACHA BANNER -->

      <button
        id="gacha-banner"
        class="gacha-banner"
        type="button"
        aria-label="가챠 페이지로 이동"
      >

        <span class="gacha-banner-tag">
          RECRUITMENT
        </span>

        <span class="gacha-banner-title">
          신규 요원 모집
        </span>

        <span class="gacha-banner-sub">
          SPECIAL RECRUITMENT
        </span>

        <span class="gacha-banner-link">
          VIEW
          <span aria-hidden="true">→</span>
        </span>

      </button>


      <!-- CENTER VISUAL -->

      <div class="lobby-visual">

        <div class="lobby-visual-placeholder">

          <span class="lobby-unit-label">
            FIELD DIVISION · UNIT 01
          </span>


          <h2 class="lobby-unit-title">
            현장부 1조
          </h2>


          <div class="lobby-unit-line"></div>


          <p class="lobby-unit-name">
            「반영」
          </p>

        </div>

      </div>


    </section>


    <!-- LOBBY NAVIGATION -->

    <nav class="lobby-nav">


      <button
        class="lobby-nav-button"
        data-screen="case"
        type="button"
      >

        <span class="nav-en">
          CASE
        </span>

        <span class="nav-ko">
          사건
        </span>

      </button>


      <button
        class="lobby-nav-button"
        data-screen="roster"
        type="button"
      >

        <span class="nav-en">
          ROSTER
        </span>

        <span class="nav-ko">
          편성
        </span>

      </button>


      <button
        class="lobby-nav-button"
        data-screen="agent"
        type="button"
      >

        <span class="nav-en">
          AGENT
        </span>

        <span class="nav-ko">
          인물
        </span>

      </button>


      <button
        class="lobby-nav-button"
        data-screen="archive"
        type="button"
      >

        <span class="nav-en">
          ARCHIVE
        </span>

        <span class="nav-ko">
          기록
        </span>

      </button>


    </nav>

  </main>
  <!-- LOBBY SCREEN 끝 -->


  <!-- ========================================
       GACHA SCREEN
  ========================================= -->

  <main
    id="gacha-screen"
    class="game-screen"
  >


    <header class="sub-screen-header">

      <button
        id="gacha-back-button"
        class="back-button"
        type="button"
      >
        ← BACK
      </button>


      <div class="sub-screen-title">

        <span class="sub-screen-title-main">
          RECRUITMENT
        </span>

        <span class="sub-screen-title-sub">
          요원 모집
        </span>

      </div>

    </header>


    <section class="gacha-page">

      <p class="gacha-page-label">
        SPECIAL RECRUITMENT
      </p>

      <h2 class="gacha-page-title">
        요원 모집
      </h2>

      <p class="gacha-page-description">
        새로운 요원을 모집할 수 있습니다.
      </p>

    </section>


  </main>
  <!-- GACHA SCREEN 끝 -->


  <!-- ========================================
       JAVASCRIPT
  ========================================= -->

  <script src="./js/audio.js?v=3"></script>
  <script src="./js/main.js?v=3"></script>


</body>

</html>
