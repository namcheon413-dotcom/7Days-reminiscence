<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>七曜回顧錄</title>

  <link rel="stylesheet" href="./css/style.css">
</head>


<body>

  <!-- ================================
       진입 화면
  ================================= -->

  <main id="title-screen">

    <!-- 배경 영상 -->

    <video
      id="title-video"
      autoplay
      muted
      loop
      playsinline
    >
      <source
        src="./assets/video/title.mp4"
        type="video/mp4"
      >
    </video>


    <!-- 영상 가독성용 레이어 -->

    <div class="video-overlay"></div>


    <!-- 중앙 UI -->

    <section class="title-content">

      <p class="fanmade">
        fanmade by anonymous agent
      </p>

      <h1 class="game-title">
        七曜回顧錄
      </h1>

      <div class="title-line"></div>

      <button
        id="start-button"
        type="button"
      >
        START
      </button>

    </section>


    <!-- 하단 -->

    <div class="bottom-text">
      7 DAYS : REMINISCENCE
    </div>

  </main>


  <!-- ================================
       오디오
  ================================= -->

  <audio
    id="title-bgm"
    src="./assets/audio/title-bgm.mp3"
    loop
    preload="auto"
  ></audio>

  <audio
    id="click-sfx"
    src="./assets/audio/click.mp3"
    preload="auto"
  ></audio>


  <script src="./js/audio.js"></script>
  <script src="./js/main.js"></script>

</body>

</html>
